[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue]
command=php /var/www/mam/artisan queue:work --queue=publication,ingest,default,media-images,media-documents,media-audio,media-video --sleep=2 --tries=3 --max-time=3600
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /var/www/mam/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Koha's public addresses (staff.localhost:8081, opac.localhost:8080) point at this container's loopback,
; so the same URLs work in the visitor's browser and here. Forward them to the Koha container.
[program:koha-staff-forward]
command=socat TCP-LISTEN:8081,bind=127.0.0.1,fork,reuseaddr TCP:koha:8081
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:koha-opac-forward]
command=socat TCP-LISTEN:8080,bind=127.0.0.1,fork,reuseaddr TCP:koha:8080
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

server {
    listen 8000 default_server;
    server_name _;
    root /var/www/mam/public;
    index index.php;
    client_max_body_size 20m;
    server_tokens off;

    # Keep single-use sign-in codes out of the access log.
    access_log off;

    # Redirect other host names (localhost, 127.0.0.1) to APP_URL; written by the entrypoint.
    include /etc/nginx/mam-canonical-host.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Keep the port: the demo runs on :8000 and Laravel builds redirects from the Host header.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
